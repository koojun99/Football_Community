logging:
  file:
    encoding: UTF-8

# actuator 설정
management:
  endpoints:
    web:
      exposure:
        include: "*" # open 할 actuator 경로 설정
  endpoint:
    health:
      show-details: always # actuator/health 에 디테일 정보 반환


spring:
  profiles:
    active: local
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: jdbc:mysql://${DB_URL}/${DB_NAME}?autoReconnect=true&setTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    sql:
      init:
        mode: never
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: create
        default_batch_fetch_size: 1000
  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
  security:
    oauth2:
          client:
            registration:
              google:
                client-id: ${GOOGLE_CLIENT_ID}
                client-secret: ${GOOGLE_CLIENT_SECRET}
                scope: # 기본 값 openid,profile,email => profile, email 로 설정 변경
                  - profile
                  - email

              naver:
                client-id: ${NAVER_CLIENT_ID}
                client-secret: ${NAVER_CLIENT_SECRET}
                client-authentication-method: client_secret_post
                authorization-grant-type: authorization_code
                redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
                #            scope:
                #              - name
                #              - email
                #              - profile_image
                client-name: Naver

              kakao:
                client-id: ${KAKAO_CLIENT_ID}
                client-secret: ${KAKAO_CLIENT_SECRET}
                client-authentication-method: client_secret_post
                authorization-grant-type: authorization_code
                scope: # https://developers.kakao.com/docs/latest/ko/kakaologin/common#user-info
                  - profile_nickname
                  - profile_image
                  - account_email
                redirect-uri: "{baseUrl}/{action}/oauth2/code/{registrationId}"
                client-name: Kakao

            provider:
              naver:
                authorization-uri: https://nid.naver.com/oauth2.0/authorize
                token-uri: https://nid.naver.com/oauth2.0/token
                user-info-uri: https://openapi.naver.com/v1/nid/me
                user-info-authentication-method: header
                user-name-attribute: response # Naver 응답 값 resultCode, message, response 중 response 지정

              kakao:
                authorization-uri: https://kauth.kakao.com/oauth/authorize
                token-uri: https://kauth.kakao.com/oauth/token
                user-info-uri: https://kapi.kakao.com/v2/user/me
                user-info-authentication-method: header
                user-name-attribute: id # Kakao 응답 값 id, connected_at, properties, kakao_account 중 id 지정

jwt:
    access-token-expiration: 7200000 # 2 hours
    refresh-token-expiration: 1209600000 # 14 days
    secret:
      key: ${JWT_SECRET}
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

football-api:
  base-url: https://api-football-v1.p.rapidapi.com/v3/fixtures
  api-key: ${FOOTBALL_API_KEY}
  api-host: https://${FOOTBALL_API_HOST}
